<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="0.55" stop-color="#14161a"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e4572e" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#e4572e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e4572e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2703f" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#d6aa4b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d6aa4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <g filter="url(#soft)">
    <circle cx="1480" cy="300" r="330" fill="url(#orb)" opacity="0.42"/>
    <circle cx="420" cy="860" r="380" fill="url(#orb)" opacity="0.28"/>
    <circle cx="1120" cy="980" r="220" fill="url(#orbWarm)" opacity="0.5"/>
    <circle cx="260" cy="180" r="200" fill="url(#orbWarm)" opacity="0.2"/>
  </g>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
