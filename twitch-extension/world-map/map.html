<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fishing area map</title>
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<style>
/* Site tokens, copied from the :root block in html/index.html (see docs/STYLE_GUIDE.md) */
:root {
  --ink-100: #0F1513;
  --ink-000: #050807;
  --ink-300: #212C29;
  --panel: #131A18;
  --bone: #EDE8DC;
  --bone-80: rgba(237, 232, 220, .8);
  --bone-60: rgba(237, 232, 220, .6);
  --bone-40: rgba(237, 232, 220, .4);
  --bone-24: rgba(237, 232, 220, .24);
  --bone-12: rgba(237, 232, 220, .12);
  --rule: 1px solid var(--bone-12);
  --signal: #E4572E;
  --font-display: 'Bricolage Grotesque', Archivo, Georgia, serif;
  --font-body: Archivo, 'Helvetica Neue', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink-100); color: var(--bone); font-family: var(--font-body); min-height: 100vh; padding: 32px 16px; }

.hub-panel { max-width: 900px; margin: 0 auto; }
.hub-panel h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; margin: 0 0 6px; }
.hub-panel-sub { color: var(--bone-40); font-size: .85rem; line-height: 1.6; margin: 0 0 22px; }

.dex-toolbar-btn {
  background: none; border: 0; border-bottom: 1px solid var(--bone-24);
  color: var(--bone-40); font-family: var(--font-mono); font-size: .62rem;
  letter-spacing: .12em; text-transform: uppercase; padding: 6px 2px; cursor: pointer;
}
.dex-toolbar-btn:hover, .dex-toolbar-btn:focus-visible { color: var(--signal); border-bottom-color: var(--signal); outline: none; }
.dex-toolbar-btn:disabled { opacity: .4; cursor: default; }
.dex-toolbar-btn:disabled:hover { color: var(--bone-40); border-bottom-color: var(--bone-24); }

.btn.solid {
  background: var(--signal); color: var(--ink-100); border: 0;
  font-family: var(--font-mono); font-size: .7rem; letter-spacing: .12em;
  text-transform: uppercase; font-weight: 600; padding: 10px 16px; cursor: pointer;
}
.btn.solid:disabled { opacity: .4; cursor: default; }
.btn.solid:focus-visible { outline: 1px solid var(--bone); outline-offset: 2px; }

.map-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 12px; flex-wrap: wrap; }
.map-hint { font-family: var(--font-mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--bone-40); }
.toolbar-group { display: flex; align-items: center; gap: 14px; }
.zoom-label { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .08em; color: var(--bone-60); min-width: 3.6em; text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- Map window ---------- */
.map-window {
  position: relative; width: 100%; height: 520px; overflow: hidden;
  border: var(--rule); background: #0d3b4a; cursor: grab; touch-action: none; user-select: none;
}
.map-window.is-dragging { cursor: grabbing; }
.map-window:focus-visible { outline: 1px solid var(--signal); outline-offset: 2px; }
/* The world is resized (not transformed) on zoom, so the artwork is redrawn sharply at every size. */
.world { position: absolute; left: 0; top: 0; }
.world > img.map-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.pins { position: absolute; inset: 0; }

/* ---------- Area buttons: fixed size, never scale with the map ---------- */
.pin {
  position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; padding: 0;
  background: var(--ink-100); border: 2px solid var(--bone);
  display: grid; place-items: center; cursor: pointer; outline: none;
}
.pin span.icon { display: contents; }
.pin svg { width: 20px; height: 20px; fill: var(--bone); }
.pin:hover, .pin:focus-visible, .pin.selected { border-color: var(--signal); }
.pin:hover svg, .pin:focus-visible svg, .pin.selected svg { fill: var(--signal); }
.pin:focus-visible { box-shadow: 0 0 0 2px var(--ink-100), 0 0 0 3px var(--bone); }
.pin.locked { border-color: var(--bone-40); }
.pin.locked svg { fill: var(--bone-40); }
.pin-badge {
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--ink-100); border: 1px solid var(--bone-24); padding: 1px 5px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; color: var(--bone);
  white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums;
}
.pin.locked .pin-badge { color: var(--bone-40); }
.pin-name {
  position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--bone); background: var(--ink-100); border: 1px solid var(--bone-24); padding: 1px 5px;
  white-space: nowrap; pointer-events: none; display: none;
}
.pin:hover .pin-name, .pin:focus-visible .pin-name, .pin.selected .pin-name { display: block; }

/* ---------- Popup: opens next to its button and closes when the map moves. Never scaled. ---------- */
.area-popup {
  position: absolute; width: 300px; max-height: calc(100% - 16px); overflow-y: auto;
  background: var(--panel); border: var(--rule); padding: 14px 16px 16px; z-index: 5;
  display: none;
}
.area-popup.open { display: block; }
.area-popup:focus { outline: none; }
.popup-arrow { position: absolute; width: 0; height: 0; z-index: 6; display: none; pointer-events: none; }
.popup-arrow.open { display: block; }
.popup-arrow.right { border-style: solid; border-width: 7px 7px 7px 0; border-color: transparent var(--bone-24) transparent transparent; }
.popup-arrow.left  { border-style: solid; border-width: 7px 0 7px 7px; border-color: transparent transparent transparent var(--bone-24); }

.popup-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.popup-title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin: 0; line-height: 1.2; }
.popup-close { background: none; border: 0; color: var(--bone-40); font-family: var(--font-mono); font-size: 14px; cursor: pointer; padding: 0 2px; line-height: 1; }
.popup-close:hover, .popup-close:focus-visible { color: var(--signal); outline: none; }
.popup-desc { color: var(--bone-60); font-size: .85rem; line-height: 1.6; margin: 6px 0 12px; }
.popup-label { font-family: var(--font-mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--bone-40); margin: 0 0 6px; }
.level-meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px; }
.level-meter span { height: 6px; background: var(--bone-12); }
.level-meter span.on { background: var(--signal); }
.popup-stats { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .06em; color: var(--bone-40); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; margin-bottom: 12px; }
.popup-stats b { color: var(--bone-80); font-weight: 500; }
.boost-list { list-style: none; margin: 0 0 12px; padding: 0; }
.boost-list li { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: .72rem; color: var(--bone-80); border-bottom: var(--rule); padding: 5px 0; font-variant-numeric: tabular-nums; }
.boost-list li span:last-child { color: var(--bone-40); }
.loot-list { list-style: none; margin: 0 0 14px; padding: 0; max-height: 150px; overflow-y: auto; }
.loot-list li { display: flex; justify-content: space-between; font-size: .78rem; color: var(--bone-60); padding: 4px 0; border-bottom: var(--rule); }
.loot-list li span:last-child { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--bone-40); }
.popup-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.popup-status { font-family: var(--font-mono); font-size: .7rem; color: var(--bone-40); letter-spacing: .04em; line-height: 1.6; margin-top: 10px; min-height: 1.6em; }

.state-message { font-family: var(--font-mono); font-size: .74rem; color: var(--bone-40); letter-spacing: .05em; line-height: 1.7; border-left: 2px solid var(--bone-12); padding-left: 18px; margin-top: 14px; }

@media (max-width: 560px) { .map-window { height: 400px; } }

/* ---------- Fishing status bar (above the map) ---------- */
.map-statusbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 6px 10px; background: var(--ink-100); border-bottom: var(--rule); }
.map-menu { position: static; display: flex; flex-direction: row; align-items: flex-start; gap: 6px; min-width: 0; }
.menu-toggle { background: var(--ink-100); border: var(--rule); padding: 4px 8px; display: flex; gap: 10px; align-items: center; cursor: pointer;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--bone-60); }
.menu-toggle:hover, .menu-toggle:focus-visible { color: var(--signal); outline: none; }
.menu-toggle .chev { color: var(--bone-40); }
.menu-body { display: flex; flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 6px; min-width: 0; }
.menu-body[hidden] { display: none; }
.fish-hud { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.hud-cell { display: flex; flex-direction: column; gap: 0; background: var(--ink-100); border: var(--rule); padding: 4px 8px; }
.hud-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--bone-40); }
.hud-value { font-family: var(--font-mono); font-size: 12px; color: var(--bone); font-variant-numeric: tabular-nums; }
.hud-value.brass { color: var(--brass); }
.hud-sub { font-family: var(--font-mono); font-size: 10px; color: var(--bone-60); font-variant-numeric: tabular-nums; }
.hud-bar { display: block; width: 100%; min-width: 80px; height: 4px; background: var(--bone-12); margin-top: 4px; }
.hud-fill { display: block; height: 100%; width: 0; background: var(--bone-60); }
.hud-switch { flex-direction: row; align-items: center; gap: 6px; }
.fish-hud > .dex-toolbar-btn { background: var(--ink-100); border: var(--rule); padding: 4px 8px; align-self: stretch; }
.switch { width: 28px; height: 14px; padding: 2px; border: 1px solid var(--bone-24); background: none; cursor: pointer; display: flex; justify-content: flex-start; }
.switch .knob { width: 8px; height: 8px; background: var(--bone-40); display: block; }
.switch[aria-checked="true"] { border-color: var(--signal); }
.switch[aria-checked="true"] .knob { background: var(--signal); margin-left: 12px; }
.switch:focus-visible { outline: 1px solid var(--bone); outline-offset: 2px; }
.hud-location { min-width: 0; }
.hud-spacer { flex: 1; }

/* ---------- Boat marker: shows the current fishing area ---------- */
.pin .boat { display: none; position: absolute; right: -14px; bottom: -14px; width: 20px; height: 20px; background: var(--signal); border: 2px solid var(--ink-100); align-items: center; justify-content: center; cursor: pointer; }
.pin .boat svg { width: 12px; height: 12px; fill: var(--ink-100); }
.pin.here .boat { display: flex; }
.pin.here { border-color: var(--signal); }

/* ---------- Legend ---------- */
.map-footbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 6px 10px; background: var(--ink-100); border-top: var(--rule); }
.map-legend {
  position: static; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; color: var(--bone-60);
}
.map-legend .row { display: flex; align-items: center; gap: 6px; background: var(--ink-100); border: var(--rule); padding: 3px 7px; }
.lg-chip { display: inline-block; width: 9px; height: 9px; border: 2px solid var(--bone); background: var(--ink-100); }
.lg-chip.lk { border-color: var(--bone-40); }
.lg-chip.bt { background: var(--signal); border-color: var(--ink-100); }
.lg-text { color: var(--bone-60); }
.map-window.is-moving .map-menu, .map-window.is-moving .map-legend { opacity: .5; }

/* ---------- Map-style menu (cartouche): hairline frame, compass badge, dividers ---------- */
.map-menu { gap: 8px; align-items: flex-start; }
.menu-toggle {
  background: var(--ink-100); border: 1px solid var(--bone-24); padding: 3px 9px 3px 4px;
  display: flex; gap: 8px; align-items: center; cursor: pointer;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--bone-80);
}
.menu-toggle:hover, .menu-toggle:focus-visible { border-color: var(--signal); color: var(--signal); outline: none; }
.menu-toggle .compass { display: inline-block; width: 18px; height: 18px; padding: 2px; border: 1px solid var(--bone-24); }
.menu-toggle .compass svg { display: block; width: 100%; height: 100%; fill: var(--bone-80); }
.menu-toggle:hover .compass svg, .menu-toggle:focus-visible .compass svg { fill: var(--signal); }
.menu-toggle .chev { color: var(--bone-40); }

/* The cartouche: a hairline frame across the top, sections divided by hairlines, lightly tinted for legibility */
.cartouche { position: relative; isolation: isolate; flex: 1 1 auto; border-top: 1px solid var(--bone-24); border-bottom: 1px solid var(--bone-24); padding: 6px 0; gap: 0; align-items: stretch; }
.cartouche::before { content: ''; position: absolute; inset: 0; background: var(--ink-100); opacity: .78; z-index: -1; }
.fish-hud { gap: 0; align-items: stretch; }
.hud-cell { background: none; border: 0; border-left: 1px solid var(--bone-12); padding: 4px 14px; min-width: 0; }
.fish-hud > .hud-cell:first-child { border-left: 0; }
.hud-switch { padding-left: 14px; }
.fish-hud > .dex-toolbar-btn { background: none; border: 0; border-left: 1px solid var(--bone-12); padding: 4px 14px; align-self: stretch; }
.hud-bar { background: var(--bone-12); height: 3px; }
.hud-fill { background: var(--bone-80); }

/* Legend: plain entries on the map, no boxes */
.map-legend { flex-direction: row; align-items: center; gap: 14px; padding: 0; }
.map-legend .row { background: none; border: 0; padding: 0; gap: 6px; }
.lg-chip { width: 9px; height: 9px; }

/* ---------- Compact top strip: matches the legend (plain text, no frame, no tint) ---------- */
.menu-toggle { background: none; border: 0; padding: 0; gap: 6px; font-size: 10px; }
.menu-toggle:hover, .menu-toggle:focus-visible { border: 0; }
.menu-toggle .compass { width: 12px; height: 12px; padding: 0; border: 0; }
.cartouche { border: 0; padding: 0; background: none; gap: 0; align-items: center; }
.cartouche::before { content: none; }
.fish-hud { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 0; }
.hud-cell { flex-direction: row; align-items: baseline; gap: 6px; padding: 0 10px; border: 0; }
.fish-hud > .hud-cell:first-child { padding-left: 0; }
.fish-hud > .hud-cell:not(:first-child) { border-left: 0; }
.hud-label { font-size: 10px; }
.hud-value { font-size: 11px; }
.hud-sub { font-size: 10px; }
.hud-bar { display: inline-block; width: 40px; min-width: 0; height: 3px; margin: 0 0 0 4px; align-self: center; }
.hud-switch { padding: 0 10px; gap: 6px; }
.switch { width: 22px; height: 11px; }
.switch .knob { width: 6px; height: 6px; }
.switch[aria-checked="true"] .knob { margin-left: 10px; }
.hud-location { padding: 0 10px; }
.fish-hud > .dex-toolbar-btn { border: 0; padding: 0 10px; align-self: center; font-size: 10px; background: none; }

/* ---------- Treasury: always in the top-right corner ---------- */
.map-treasury { position: static; display: flex; align-items: baseline; gap: 6px; flex: 0 0 auto; }
.map-treasury .hud-value { font-size: 13px; }
.map-window.is-moving .map-treasury { opacity: .5; }

/* ---------- Scrollbars: the site theme (same tokens and sizes as styles/index.css) ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--ink-000); }
::-webkit-scrollbar-thumb { background: var(--ink-300); border: 2px solid var(--ink-000); }
::-webkit-scrollbar-thumb:hover { background: var(--bone-24); }
html { scrollbar-color: var(--bone-24) transparent; }

/* ---------- Fish gallery ---------- */
/* The fish list starts collapsed; the header row keeps its height while it loads. */
.fish-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: none; border: 0; border-bottom: var(--rule); padding: 0 0 6px; margin: 0 0 8px; cursor: pointer; color: inherit; text-align: left; }
.fish-toggle .popup-label { margin: 0; }
.fish-toggle:hover .popup-label, .fish-toggle:focus-visible .popup-label { color: var(--bone-80); }
.fish-toggle:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.fish-chevron { font-family: var(--font-mono); font-size: .8rem; color: var(--bone-60); line-height: 1; }
.gallery { list-style: none; margin: 0 0 14px; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; max-height: 200px; overflow-y: auto; }
.tile { border: var(--rule); padding: 5px 7px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile-name { font-size: .74rem; color: var(--bone-40); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.got .tile-name { color: var(--bone-80); }
.tile-tier { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--bone-40); min-height: 1em; }

/* ---------- Other players fishing here (live: verdigris) ---------- */
.pin .rival { display: none; position: absolute; bottom: -14px; width: 14px; height: 14px; background: var(--ink-100); border: 1px solid var(--verdigris); align-items: center; justify-content: center; }
.pin .rival svg { width: 9px; height: 9px; fill: var(--verdigris); }
.pin .rival { display: flex; }
:root { --verdigris: #2F7D6E; }

/* ---------- Editable zoom ---------- */
.zoom-input { width: 4.6em; background: none; border: 0; border-bottom: 1px solid var(--bone-24); color: var(--bone-60);
  font-family: var(--font-mono); font-size: .66rem; letter-spacing: .08em; text-align: center; padding: 2px 0; font-variant-numeric: tabular-nums; }
.zoom-input:focus { outline: none; border-bottom-color: var(--signal); color: var(--bone); }
.zoom-input:focus-visible { outline: 1px solid var(--bone); outline-offset: 2px; }

/* ---------- Search ---------- */
.search-wrap { position: relative; flex: 1 1 200px; max-width: 280px; }
.search-input { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--bone-24); color: var(--bone); font-family: var(--font-mono); font-size: .7rem; letter-spacing: .04em; padding: 5px 2px; }
.search-input::placeholder { color: var(--bone-40); }
.search-input:focus { outline: none; border-bottom-color: var(--signal); }
.search-input:focus-visible { outline: 1px solid var(--bone); outline-offset: 2px; }
.search-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 10; list-style: none; margin: 0; padding: 0; background: var(--ink-100); border: var(--rule); max-height: 240px; overflow-y: auto; }
.search-results li { padding: 7px 10px; border-bottom: var(--rule); cursor: pointer; font-family: var(--font-mono); font-size: .7rem; color: var(--bone-80); display: flex; justify-content: space-between; gap: 10px; }
.search-results li:last-child { border-bottom: 0; }
.search-results li .kind { color: var(--bone-40); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.search-results li:hover, .search-results li:focus-visible, .search-results li.active { color: var(--signal); outline: none; }
.search-results li:focus-visible .kind, .search-results li.active .kind { color: var(--signal); }
.search-results .none { color: var(--bone-40); cursor: default; }

/* ---------- Unlock / upgrade preview ---------- */
.preview { margin: 0 0 14px; }
.preview .popup-stats { margin-bottom: 0; }

/* ---------- Bottom sheet on small screens ---------- */
.area-popup.sheet { width: auto; max-height: 62%; border-left: 0; border-right: 0; border-bottom: 0; }
.area-popup.sheet .loot-list, .area-popup.sheet .gallery { max-height: 120px; }

/* ---------- Larger tap targets ---------- */
.pin::before { content: ''; position: absolute; inset: -8px; }
@media (pointer: coarse) {
  .pin { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
  .pin svg { width: 24px; height: 24px; }
  .pin .boat, .pin .rival { width: 22px; height: 22px; }
}

/* ---------- Readability: small shadow under the map UI text ---------- */
.map-window .map-menu, .map-window .map-treasury, .map-window .map-legend,
.map-window .pin-badge, .map-window .pin-name { text-shadow: 0 1px 2px rgba(0, 0, 0, .9), 0 0 1px rgba(0, 0, 0, .8); }

/* ---------- Sea lanes: faint routes with boats sailing along them ---------- */
.sea-lanes { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.sea-lanes .lane { fill: none; stroke: rgba(237, 232, 220, .22); stroke-width: 1.4; stroke-dasharray: 3 6; }

/* ---------- Expand button (bottom right of the map) ---------- */
.expand-btn {
  position: static; flex: 0 0 auto;
  background: var(--ink-100); border: 1px solid var(--bone-24); padding: 3px 9px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--bone-80); cursor: pointer;
}
.expand-btn:hover, .expand-btn:focus-visible { border-color: var(--signal); color: var(--signal); outline: none; }

/* ---------- Expanded view: the whole fishing panel fills the screen ---------- */
.hub-panel.is-expanded {
  position: fixed; inset: 0; z-index: 1000; max-width: none; margin: 0; padding: 16px 24px;
  background: var(--ink-100); display: flex; flex-direction: column; overflow: hidden;
}
.hub-panel.is-expanded > h2, .hub-panel.is-expanded > .hub-panel-sub { display: none; }
.hub-panel.is-expanded .map-toolbar { margin-bottom: 8px; }
.hub-panel.is-expanded .map-window { flex: 1 1 auto; height: auto; min-height: 0; }
body.map-expanded { overflow: hidden; }

/* ---------- Boats and their wake ---------- */
.sea-lanes .wake-line { fill: none; stroke: rgba(237, 232, 220, .8); stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 4 3; animation: wakeFlow 2.6s linear infinite; }
.sea-lanes .wake-line.w2 { stroke-width: 1; animation-delay: -.9s; opacity: .8; }

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function showToast(text, busy) {

// The building's popup is drawn by the main page over this map. It is anchored to the pin's
// screen position (sent here), and it closes when the map is moved (see dismissBuilding).
function buildingPoint(id) {
  const pin = pinsLayer.querySelector(`.pin[data-building="${id}"]`);
  if (!pin) return null;
  const r = pin.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };

function openBuilding(id, pin) {
  const b = BUILDINGS[id];
  if (!b) return;
  if (areaData?.buildingLocked && areaData.buildingLocked[id]) { showToast(b.lock || `${b.label} is locked`); return; }
  closePopup();
  buildingOpen = id;
  render();
  const p = pin ? buildingPoint(id) : null;
  parentPost({ type: 'wm-building', id, label: b.label, x: p ? p.x : 0, y: p ? p.y : 0 });
}
// Closes the building popup in the main page. Called when the map is dragged, zoomed, or clicked.
function dismissBuilding() {
  if (!buildingOpen) return;
  buildingOpen = null;
  render();

}
// Tells the main page where the open building's pin is now (after the map frame is resized).
function anchorBuilding() {
  if (!buildingOpen) return;
  const p = buildingPoint(buildingOpen);
  if (p) parentPost({ type: 'wm-anchor', id: buildingOpen, x: p.x, y: p.y });
}
// Sends an action to the page and shows it as in progress until the page reports back.
function sendAction(msg, label, busyLabel) {
  pending = { action: msg.action, areaId: msg.areaId || null };
  showToast(busyLabel, true);
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => {
    if (!pending) return;
    pending = null;
    showToast('No reply yet. Try again.', false);
    render();
  }, 12000);
  parentPost(msg);
  render();
}
function finishPending() {
  if (!pending) return;
  pending = null;
  clearTimeout(pendingTimer);
  showToast('Done.', false);
  render();
}
function busyLabelFor(action, areaId) {
  const name = areaFor(areaId)?.name || 'area';
  if (action === 'buy') return `Unlocking ${name}…`;
  if (action === 'upgrade') return `Upgrading ${name}…`;
  if (action === 'fish') return `Selecting ${name}…`;
  if (action === 'stop' || (action === 'select' && !areaId)) return 'Deselecting…';
  return 'Working…';
}

// ---------- View: the artwork is resized only when zoom changes; panning moves it with a transform ----------
function applyView() {
  const W = MAP_W * zoom, H = MAP_H * zoom;
  const w = win.clientWidth, h = win.clientHeight;
  pos.x = W <= w ? (w - W) / 2 : Math.min(0, Math.max(w - W, pos.x));
  pos.y = H <= h ? (h - H) / 2 : Math.min(0, Math.max(h - H, pos.y));
  if (world.dataset.w !== String(W)) {
    world.style.width = W + 'px';
    world.style.height = H + 'px';
    world.dataset.w = String(W);
  }
  world.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0)`;

}
// Any change of view closes the popup, so it never drifts away from its button.
function changeView(fn) {

  dismissBuilding();
  fn();
  applyView();
  markMoving();
}
function setZoom(z, sx, sy) {
  changeView(() => {
    const w = win.clientWidth, h = win.clientHeight;
    if (sx === undefined) { sx = w / 2; sy = h / 2; }
    const nz = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
    const mx = (sx - pos.x) / zoom, my = (sy - pos.y) / zoom;   // map point under the cursor
    zoom = nz;
    pos.x = sx - mx * zoom;
    pos.y = sy - my * zoom;
  });
}
function centerOn(a) {
  changeView(() => {
    pos.x = win.clientWidth / 2 - a.px * MAP_W * zoom;
    pos.y = win.clientHeight / 2 - a.py * MAP_H * zoom;
  });
}
// The map keeps the same centre whenever its window changes size (expand, collapse, or the page resizing).
let lastW = 0, lastH = 0;
new ResizeObserver(() => {
  const w = win.clientWidth, h = win.clientHeight;
  if (w === lastW && h === lastH) return;
  if (lastW) {
    const cx = (lastW / 2 - pos.x) / zoom, cy = (lastH / 2 - pos.y) / zoom;
    pos.x = w / 2 - cx * zoom;
    pos.y = h / 2 - cy * zoom;
    pauseSea(450);
  }
  lastW = w; lastH = h;
  applyView();
  if (openId) placePopup(openId);
  anchorBuilding();
}).observe(win);

// ---------- Input: wheel, drag, pinch, keys ----------
win.addEventListener('wheel', (e) => {
  if (e.target.closest('.area-popup, .map-menu, .map-treasury, .expand-btn')) return;
  e.preventDefault();
  const r = win.getBoundingClientRect();
  setZoom(zoom * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
function localPoint(e) { const r = win.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
win.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.area-popup, .map-menu, .map-treasury, .expand-btn')) return;
  if (pointers.size === 0) moved = false;
  pointers.set(e.pointerId, localPoint(e));
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: zoom };
    drag = null;
    moved = true;
  } else if (pointers.size === 1 && e.button === 0) {
    drag = { sx: e.clientX, sy: e.clientY, px: pos.x, py: pos.y, id: e.pointerId };
  }
});
win.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, localPoint(e));
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    setZoom(pinch.z * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d), (a.x + b.x) / 2, (a.y + b.y) / 2);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!moved && Math.hypot(dx, dy) > 5) {
    moved = true;
    win.setPointerCapture(drag.id);
    win.classList.add('is-dragging');
    closePopup();
    dismissBuilding();
  }
  if (!moved) return;
  pos.x = drag.px + dx;
  pos.y = drag.py + dy;
  applyView();
  markMoving();
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) { drag = null; win.classList.remove('is-dragging'); markMoving(); }
}
win.addEventListener('pointerup', endPointer);
win.addEventListener('pointercancel', endPointer);
win.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePopup(); dismissBuilding(); return; }
  if (e.key === '+' || e.key === '=') { setZoom(zoom * 1.2); return; }
  if (e.key === '-' || e.key === '_') { setZoom(zoom / 1.2); return; }
  const step = 40;
  const map = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
  if (!map[e.key]) return;
  e.preventDefault();
  changeView(() => { pos.x += map[e.key][0]; pos.y += map[e.key][1]; });
});
win.addEventListener('click', (e) => {
  if (moved) return;
  if (!e.target.closest('.pin, .area-popup, .map-menu, .map-treasury, .expand-btn')) { closePopup(); dismissBuilding(); }
});
pinsLayer.addEventListener('click', (e) => {
  if (moved) return;
  const pin = e.target.closest('.pin');
  if (!pin) return;
  // The boat on the active area leaves it; anywhere else on a pin opens its popup.
  if (pin.dataset.building) { openBuilding(pin.dataset.building, pin); return; }
  if (e.target.closest('.boat') && pin.classList.contains('here')) { parentPost({ type: 'wm-action', action: 'select', areaId: null }); return; }
  openArea(pin.dataset.id);
});
pinsLayer.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const pin = e.target.closest('.pin');
  if (!pin) return;
  e.preventDefault();
  if (pin.dataset.building) { openBuilding(pin.dataset.building, pin); return; }
  openArea(pin.dataset.id);
});

// ---------- Search: areas, fish and perks ----------
const searchInput = $('searchInput'), searchResults = $('searchResults');
// Perks and the city popup each one is in. The labels match the names players see.
const PERK_SEARCH = [
  { label: 'Permanent 1.5x Luck', building: 'perks' },
  { label: 'Temporary 2x Luck', building: 'perks' },
  { label: 'Vipfish', building: 'perks' },
  { label: 'Shieldfish', building: 'perks' },
  { label: 'Global Luck Event', building: 'perks' },
  { label: '1.25x Luck (Permanent)', building: 'shop' },
  { label: '15% Cooldown Reduction', building: 'shop' },
  { label: '1.5x Treasury Luck', building: 'shop' },
  { label: '2x Rarity Luck (15 min)', building: 'shop' },
  { label: 'Treasury Only Mode', building: 'shop' },
  { label: "Fisherman's Fortune", building: 'shop' },
  { label: 'Treasury Waters', building: 'pond' },
  { label: 'Species Hunter', building: 'pond' },
  { label: 'Bait Saver', building: 'pond' },
  { label: "Collector's Instinct", building: 'pond' },
  { label: 'Still Waters', building: 'pond' },
  { label: 'Deep Current', building: 'pond' },
  { label: 'Bigger Haul', building: 'pond' },
  { label: 'Fishy Fortune', building: 'pond' }
];
const BUILDING_NAMES = { perks: 'Perks', shop: 'Shop', pond: 'Pond' };
function hideSearch() { searchResults.hidden = true; searchInput.setAttribute('aria-expanded', 'false'); }
function areaNameFor(id) { return areaFor(id)?.name || id; }
function searchMatches(q) {
  const results = [];
  (areaData?.areas || []).forEach((a) => {
    if (AREA_LAYOUT[a.id] && a.name.toLowerCase().includes(q)) {
      results.push({ kind: 'area', id: a.id, label: a.name, meta: areaData?.readOnly === true ? 'Public area' : (a.unlocked ? 'Level ' + a.level : 'Locked') });
    }
  });
  // Fish: each name once. Fish from fishing areas go to the first area they are caught in.
  const seenFish = new Set();
  for (const [name, , areaIds] of (areaData?.fish || [])) {
    if (!name.toLowerCase().includes(q) || seenFish.has(name)) continue;
    seenFish.add(name);
    const onMap = (areaIds || []).filter((id) => AREA_LAYOUT[id]);
    results.push({
      kind: 'fish',
      id: onMap[0] || '',
      label: name,
      meta: onMap.length ? onMap.map(areaNameFor).join(', ') : 'Normal waters'
    });
  }
  PERK_SEARCH.forEach((p) => {
    if (p.label.toLowerCase().includes(q)) {
      results.push({ kind: 'perk', id: p.building, label: p.label, meta: BUILDING_NAMES[p.building] + ' popup' });
    }
  });
  return results;
}
function renderSearch() {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { hideSearch(); return; }
  const results = searchMatches(q).slice(0, 12);
  searchResults.innerHTML = results.length
    ? results.map((r) => `<li role="option" tabindex="-1" data-go="${r.kind}" data-id="${esc(r.id)}" data-label="${esc(r.label)}">${esc(r.label)}<span class="kind">${esc(r.meta)}</span></li>`).join('')
    : '<li class="none" role="option">No match</li>';
  searchResults.hidden = false;
  searchInput.setAttribute('aria-expanded', 'true');
}
function chooseResult(li) {
  const kind = li.dataset.go, id = li.dataset.id, label = li.dataset.label;
  searchInput.value = '';
  hideSearch();
  if (kind === 'area' || (kind === 'fish' && id)) {
    centerOn(AREA_LAYOUT[id]);
    openArea(id);
  } else if (kind === 'fish') {
    showToast(`${label} is caught in the normal waters, not in a fishing area.`);
  } else if (kind === 'perk') {
    openBuilding(id);
  }
}
searchInput.addEventListener('input', renderSearch);
searchInput.addEventListener('keydown', (e) => {
  const items = [...searchResults.querySelectorAll('li[data-go]')];
  if (e.key === 'ArrowDown' && items.length) { e.preventDefault(); items[0].focus(); }
  else if (e.key === 'Enter' && items.length) { e.preventDefault(); chooseResult(items[0]); }
  else if (e.key === 'Escape') { searchInput.value = ''; hideSearch(); }
});
searchResults.addEventListener('click', (e) => {
  const li = e.target.closest('li[data-go]');
  if (li) chooseResult(li);
});
searchResults.addEventListener('keydown', (e) => {
  const items = [...searchResults.querySelectorAll('li[data-go]')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' && i < items.length - 1) { e.preventDefault(); items[i + 1].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (i > 0) items[i - 1].focus(); else searchInput.focus(); }
  else if (e.key === 'Enter' && i >= 0) { e.preventDefault(); chooseResult(items[i]); }
  else if (e.key === 'Escape') { searchInput.focus(); hideSearch(); }
});
searchInput.addEventListener('blur', () => setTimeout(() => { if (!searchResults.contains(document.activeElement)) hideSearch(); }, 150));

// ---------- Saved view (per browser; never required) ----------
const VIEW_KEY = 'fishing-map-view-v1';
function queueSaveView() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(VIEW_KEY, JSON.stringify({ zoom, x: pos.x, y: pos.y })); } catch (e) { /* storage blocked: skip */ }
  }, 300);
}
function restoreView() {
  try {
    const v = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null');
    if (!v || !isFinite(v.zoom) || !isFinite(v.x) || !isFinite(v.y)) return false;
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, v.zoom));
    pos.x = v.x; pos.y = v.y;
    applyView();
    return true;
  } catch (e) { return false; }
}

// ---------- Pins, status and popup from the live data ----------
function buildPins() {
  const buildingPins = Object.entries(BUILDINGS).map(([id, b]) => `
    <button class="pin building" type="button" data-building="${id}" style="left:${(b.x / MAP_W * 100).toFixed(3)}%; top:${(b.y / MAP_H * 100).toFixed(3)}%" aria-label="${b.label}">
      <span class="icon">${spriteSVG(ICON_BITMAPS[b.icon])}</span>
      <span class="pin-badge">LOCKED</span>
      <span class="pin-name">${b.label}</span>
      <span class="status-badge" aria-hidden="true"></span>
    </button>`).join('');
  pinsLayer.innerHTML = buildingPins + Object.entries(AREA_LAYOUT).map(([id, a]) => `
    <button class="pin" type="button" data-id="${id}" style="left:${(a.px * 100).toFixed(3)}%; top:${(a.py * 100).toFixed(3)}%" aria-label="${id}">
      <span class="icon">${spriteSVG(ICON_BITMAPS[a.icon])}</span>
      <span class="pin-badge" data-level-text>LOCKED</span>
      <span class="pin-name" data-name>${id}</span>
      <span class="boat" role="button" tabindex="-1" aria-label="Leave this area">${BOAT_ICON}</span>
    </button>`).join('');
}
function render() {
  const d = areaData;
  const publicMode = d?.readOnly === true;
  document.body.classList.toggle('public-view', publicMode);
  $('emptyNote').hidden = !!d;
  if (d) {
    const dc = d.doubleCatch || { level: 0, chance: 0, points: 0 };
    const active = (d.areas || []).find((a) => a.id === d.active);
    $('treasuryValue').textContent = String(Number(d.treasury || 0));
    $('dcLevel').textContent = 'Lv.' + dc.level;
    $('dcChance').textContent = dc.chance + '% chance';
    $('dcFill').style.width = ((dc.level >= 5 ? 1 : (Number(dc.points || 0) % 3) / 3) * 100) + '%';
    $('dcSwitchCell').hidden = !(dc.level > 0);
    $('switchDouble').setAttribute('aria-checked', String(d.userDoubleEnabled !== false));
    $('switchFish').setAttribute('aria-checked', String(useAreas()));
    $('switchFish').disabled = d.areasEnabled === false;
    $('locationLabel').textContent = !useAreas() ? 'Areas off' : (active ? active.name : 'Normal waters');
    $('deselectBtn').disabled = !d.active;
  }
  pinsLayer.querySelectorAll('.pin[data-building]').forEach((b) => {
    const id = b.dataset.building;
    const locked = !publicMode && !!(d?.buildingLocked && d.buildingLocked[id]);
    b.classList.toggle('locked', locked);
    b.classList.toggle('selected', id === buildingOpen);
    const st = d?.buildingStatus?.[id];
    const show = !locked && !!st;
    b.classList.toggle('has-status', show);
    b.classList.toggle('status-dot', show && st === true);
    b.querySelector('.status-badge').textContent = show && st !== true ? String(st) : '';
    b.setAttribute('aria-label', `${BUILDINGS[id].label}${locked ? ', locked' : ''}${show ? (st === true ? ', needs attention' : `, ${st} unread`) : ''}`);
  });
  pinsLayer.querySelectorAll('.pin[data-id]').forEach((b) => {
    const id = b.dataset.id;
    const a = areaFor(id);
    const unlocked = publicMode || !!(a && a.unlocked);
    const level = publicMode ? 0 : Number(a?.level || 0);
    const disabled = !a || (!publicMode && (a.enabled === false || d?.areasEnabled === false));
    b.classList.toggle('locked', !unlocked);
    b.classList.toggle('disabled', disabled);
    b.classList.toggle('here', !!(a && a.id === d?.active && useAreas()));
    b.classList.toggle('selected', id === openId);
    b.classList.toggle('tutorial', id === tutorialId);
    b.querySelector('[data-level-text]').textContent = publicMode ? 'VIEW' : (unlocked ? `LV ${level}` : 'LOCKED');
    b.querySelector('[data-name]').textContent = a ? a.name : id;
    b.setAttribute('aria-label', `${a ? a.name : id}, ${publicMode ? 'public area guide' : (unlocked ? 'level ' + level : 'locked')}${id === tutorialId ? ', guide step' : ''}`);
  });
  if (openId) {
    if (areaFor(openId)) renderPopup(openId);
    else closePopup();
  }
}
function renderPopup(id) {
  const a = areaFor(id);
  const d = areaData;
  const publicMode = d?.readOnly === true;
  const unlocked = publicMode || !!a.unlocked;
  const level = Number(a.level || 0);
  const maxed = !publicMode && unlocked && level >= 5;
  const off = !publicMode && (d?.areasEnabled === false || a.enabled === false);
  const balance = Number(d?.treasury || 0);
  const cost = unlocked ? (maxed ? 0 : (a.levelCosts || [])[Math.max(0, level - 1)]) : a.unlockCost;
  const canPay = balance >= Number(cost || 0);
  const boosts = Object.entries(a.boost || {});
  const meter = [1, 2, 3, 4, 5].map((i) => `<span class="${i <= level ? 'on' : ''}"></span>`).join('');

  let action = '';
  let fish = '';
  let note = '';
  if (publicMode) {
    action = '<span class="public-area-label">Public area guide · read only</span>';
    note = 'Explore this area, view its boosts and browse the local catch list. Area purchases and personal fishing settings are available in the My Account tab.';
  } else {
    const busy = !!pending;
    const pend = pending && pending.areaId === id ? pending.action : null;
    if (off) action = '<button class="dex-toolbar-btn" type="button" disabled>Unavailable</button>';
    else if (!unlocked) action = `<button class="btn solid" type="button" data-action="buy" ${canPay && !busy ? '' : 'disabled'}>${pend === 'buy' ? 'Unlocking…' : 'Unlock · ' + cost}</button>`;
    else if (!maxed) action = `<button class="btn solid" type="button" data-action="upgrade" ${canPay && !busy ? '' : 'disabled'}>${pend === 'upgrade' ? 'Upgrading…' : 'Upgrade · ' + cost}</button>`;
    else action = '<button class="dex-toolbar-btn" type="button" disabled>Max level</button>';

    if (!off && unlocked) {
      fish = a.selected
        ? `<button class="dex-toolbar-btn" type="button" data-action="stop" ${busy ? 'disabled' : ''}>${pend === 'stop' ? 'Stopping…' : 'Stop fishing here'}</button>`
        : `<button class="btn solid" type="button" data-action="fish" style="font-size:.66rem;padding:8px 12px" ${useAreas() && !busy ? '' : 'disabled'}>${pend === 'fish' ? 'Selecting…' : 'Fish here'}</button>`;
    }
    if (off) note = 'This area is currently disabled.';
    else if (!useAreas()) note = 'Turn on "Use fishing areas" above the map to fish here.';
    else if (!canPay && !maxed) note = `Need ${cost} treasury items. You have ${balance}.`;
  }
  const preview = publicMode || maxed ? '' : `<div class="preview"><p class="popup-label">${unlocked ? 'Next level' : 'Unlock gives'}</p><div class="popup-stats"><span>Catch <b>${catchPct(unlocked ? level : 0)}% → ${catchPct(unlocked ? level + 1 : 1)}%</b></span><span>Boosts <b>${boosts.length}</b></span></div></div>`;
  const levelLabel = publicMode ? 'Public area' : (unlocked ? 'Level ' + level + ' / 5' : '· locked');
  const catchLabel = publicMode ? (Number(a.catchChance || 8) + '% base chance') : (unlocked ? a.catchChance + '%' : catchPct(1) + '%');

  const html = `
    <div class="popup-head">
      <h3 class="popup-title" id="popupTitle">${esc(a.name)}</h3>
      <button class="popup-close" type="button" aria-label="Close" data-action="close">×</button>
    </div>
    <p class="popup-desc">${esc(a.description || '')}</p>
    <p class="popup-label">${levelLabel}</p>
    ${publicMode ? '' : `<div class="level-meter" aria-hidden="true">${meter}</div>`}
    <div class="popup-stats"><span>${publicMode ? 'Base chance' : 'Catch'} <b>${catchLabel}</b></span><span>Catch pool <b>${a.lootCount}</b></span></div>
    ${boosts.length ? `<p class="popup-label">Area boosts</p><ul class="boost-list">${boosts.map(([n, v]) => `<li><span>${esc(n)}</span><span>+${v}</span></li>`).join('')}</ul>` : ''}
    ${fishGallery(id)}

  popup._html = html;

// The fish list: a header row that opens and closes the list. Collapsed by default.
const fishOpen = {};          // areaId -> true while its fish list is expanded
function fishGallery(id) {
  const list = lootCache[id];
  const open = !!fishOpen[id];
  const head = (count) => `<button class="fish-toggle" type="button" data-action="fish-toggle" aria-expanded="${open}" aria-controls="fish-list"><span class="popup-label">Fish${count}</span><span class="fish-chevron" aria-hidden="true">${open ? '−' : '+'}</span></button>`;
  if (list === undefined) { requestLoot(id); return head('') + (open ? '<p class="popup-note">Loading fish…</p>' : ''); }
  if (list === null) return head('') + (open ? '<p class="popup-note">The fish list could not load. Open this area again to retry.</p>' : '');
  const rank = (t) => { const i = TIER_ORDER.indexOf(String(t).toUpperCase()); return i < 0 ? 99 : i; };
  const sorted = [...list].sort((x, y) => rank(x.tier) - rank(y.tier) || x.name.localeCompare(y.name));
  if (!open) return head(` · ${sorted.length}`);
  return head(` · ${sorted.length}`) + `<ul class="gallery" id="fish-list">${sorted.map((f) => `<li class="tile got"><span class="tile-name">${esc(f.name)}</span><span class="tile-tier">${esc(f.tier)}</span></li>`).join('')}</ul>`;
}
function requestLoot(id) {
  if (lootAsked[id]) return;
  lootAsked[id] = true;
  parentPost({ type: 'wm-loot-request', areaId: id });
}

function openArea(id) {
  if (!AREA_LAYOUT[id]) return;
  dismissBuilding();
  if (lootCache[id] === null) { delete lootCache[id]; delete lootAsked[id]; }   // retry a failed list
  openId = id;
  fishOpen[id] = false;         // the fish list always starts collapsed
  popup._html = null;
  render();
  popup.classList.add('open');
  placePopup(id);
  popup.focus({ preventScroll: true });
}
function closePopup() {
  if (!popup.classList.contains('open')) return;
  popup.classList.remove('open');
  arrow.classList.remove('open');
  openId = null;
  popup._html = null;
  pinsLayer.querySelectorAll('.pin.selected').forEach((b) => b.classList.remove('selected'));
}
// Next to its pin: right if there is room, otherwise left. Small screens get a bottom sheet.
function placePopup(id) {
  const a = AREA_LAYOUT[id];
  const w = win.clientWidth, h = win.clientHeight;
  const ax = pos.x + a.px * MAP_W * zoom, ay = pos.y + a.py * MAP_H * zoom;
  if (w < 560) {
    popup.classList.add('sheet');
    popup.style.left = '0px'; popup.style.right = '0px'; popup.style.width = '';
    popup.style.top = ''; popup.style.bottom = '0px';
    arrow.classList.remove('open');
    return;
  }
  popup.classList.remove('sheet');
  popup.style.right = ''; popup.style.bottom = '';
  const pw = Math.min(300, w - 16);
  popup.style.width = pw + 'px';
  const ph = popup.offsetHeight;
  const rightRoom = w - (ax + GAP + pw) >= 8;
  const side = rightRoom ? 'right' : 'left';
  let left = rightRoom ? ax + GAP : ax - GAP - pw;
  left = Math.max(8, Math.min(left, w - pw - 8));
  const top = Math.max(8, Math.min(ay - 40, h - ph - 8));
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
  const ay2 = Math.max(top + 14, Math.min(ay, top + ph - 14));

    const target = Math.atan2(ahead.y - behind.y, ahead.x - behind.x);
    if (b.angle === null) b.angle = target;
    let diff = target - b.angle;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    b.angle += diff * (first ? 1 : 0.12);
    const deg = b.angle * 180 / Math.PI;
    const flip = Math.cos(b.angle) > 0 ? -1 : 1;
    // fade in when leaving a border exit and out when reaching one; harbor boats stay visible
    let fade = 1;
    if ((b.dir === 1 ? e.a : e.b).border) fade = Math.min(fade, b.s / 30);
    if ((b.dir === 1 ? e.b : e.a).border) fade = Math.min(fade, (e.len - b.s) / 30);
    fade = Math.max(0, Math.min(1, fade));
    b.boat.setAttribute('transform', `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)})`);
    b.boat.setAttribute('opacity', fade.toFixed(3));
    b.wake.setAttribute('transform', `rotate(${deg.toFixed(2)})`);
    b.wake.setAttribute('opacity', resting ? '0' : '1');
    b.hull.setAttribute('transform', `scale(${flip} 1)`);
  }
}
function tick(now) {
  const dt = lastTick === null ? 0 : Math.min(0.05, (now - lastTick) / 1000);
  lastTick = now;
  if (now >= seaPausedUntil) {
    seaSvg.classList.remove('is-still');
    placeBoats(dt, false);
  }
  requestAnimationFrame(tick);
}

// ---------- Expand: the embedding page makes this frame fill the screen ----------
function setExpandedLabel() {
  expandBtn.textContent = expanded ? 'Collapse' : 'Expand';
  expandBtn.setAttribute('aria-expanded', String(expanded));
}
expandBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  parentPost({ type: 'wm-expand', on: !expanded });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && expanded && !popup.classList.contains('open')) parentPost({ type: 'wm-expand', on: false });
}, true);

// ---------- Messages with the embedding page ----------
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || e.source !== window.parent) return;
  const m = e.data || {};
  if (m.type === 'wm-data') { areaData = m.data || null; render(); }
  else if (m.type === 'wm-expanded') { expanded = !!m.on; setExpandedLabel(); }
  else if (m.type === 'wm-tutorial') { setTutorial(m.areaId || null); }
  else if (m.type === 'wm-focus-area') { focusGuideArea(m.areaId || null); }
  else if (m.type === 'wm-done') { finishPending(); }
  else if (m.type === 'wm-open-building') {
    const pin = pinsLayer.querySelector(`.pin[data-building="${m.id}"]`);
    if (pin && BUILDINGS[m.id]) openBuilding(m.id, pin);
  }
  else if (m.type === 'wm-building-closed') { if (m.id === buildingOpen) { buildingOpen = null; render(); } }
  else if (m.type === 'wm-loot') {
    lootCache[m.areaId] = m.loot || null;
    if (openId === m.areaId) { popup._html = null; render(); }
  }
});

// ---------- Start ----------
buildPins();
buildSeaLanes();
if (!restoreView()) {
  zoom = DEFAULT_ZOOM;
  applyView();
  centerOn(AREA_LAYOUT.forest);
}
setExpandedLabel();
// On narrow screens the fishing status starts folded, so the map keeps most of the height.
if (window.innerWidth < 560) {
  $('menuToggle').setAttribute('aria-expanded', 'false');
  $('menuBody').hidden = true;
  $('menuChev').textContent = '▸';
}
parentPost({ type: 'wm-ready' });
</script>
</body>
</html>
